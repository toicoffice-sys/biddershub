<script>
// ── STATE ──────────────────────────────────────────────────────
let SESSION = { token: null, user: null };
let CATEGORIES = [];
let DOCUMENT_TYPES = [];
let BID_DOCUMENT_TYPES = [];
let BID_SUBMISSION_DOCUMENT_TYPES = [];
let APPLY_DOCS = {};
let APPLY_TOKEN = null;
let EDITOR_DOCS = {};
let REVISION_DOCS = {};
let SUBMISSION_DOCS = {};
let CURRENT_BID_ID = null;
let PUBLIC_BIDS = [];
let PUBLIC_FILTER = null; // null = all, 'open' = Published, 'awarded' = Closed+Awarded
let PUBLIC_PAGE  = 1;
const PUBLIC_PAGE_SIZE = 10;

// ── GOOGLE.SCRIPT.RUN PROMISE WRAPPER ───────────────────────────
function gsRun(fnName, ...args) {
  return new Promise((resolve, reject) => {
    google.script.run
      .withSuccessHandler(res => {
        if (res === null || res === undefined) {
          // google.script.run occasionally delivers null instead of invoking the
          // failure handler for certain server-side exceptions — this is a known
          // quirk of the Apps Script client bridge, not a sign the call "worked."
          reject(new Error(fnName + '() returned no data — the server likely threw an error. Check the Apps Script editor’s Executions log for the real cause.'));
        } else {
          resolve(res);
        }
      })
      .withFailureHandler(err => reject(err && err.message ? err : new Error(String(err))))
      [fnName](...args);
  });
}

// ── UTILITIES ────────────────────────────────────────────────
function escapeHtml(s) {
  if (s === null || s === undefined) return '';
  return String(s).replace(/[&<>"']/g, c => ({ '&':'&amp;', '<':'&lt;', '>':'&gt;', '"':'&quot;', "'":'&#39;' }[c]));
}
function fmtDate(iso) {
  if (!iso) return '—';
  const d = new Date(iso);
  if (isNaN(d.getTime())) return '—';
  return d.toLocaleDateString('en-PH', { dateStyle: 'medium' });
}
function fmtMoney(n) {
  return '₱' + (Number(n) || 0).toLocaleString('en-PH', { minimumFractionDigits: 2, maximumFractionDigits: 2 });
}
// Maps a status to an "office stamp" ink color — the same logic a real
// procurement desk uses: blue ink for received/in-review, green for
// approved, oxblood for closed/rejected, and no stamp at all for drafts.
function stampClass(s) {
  const map = {
    Draft: 'stamp-grey', PendingApproval: 'stamp-blue', Approved: 'stamp-green',
    Published: 'stamp-green', Closed: 'stamp-grey', Pending: 'stamp-blue',
    Rejected: 'stamp-red', Expired: 'stamp-red', Open: 'stamp-blue', Answered: 'stamp-green',
  };
  return map[s] || 'stamp-grey';
}
function roleLabel(role) {
  return { cpd_admin: 'Administrator', cpd_officer: 'Officer', proponent: 'Proponent', vendor: 'Vendor' }[role] || role;
}
function toast(msg, type) {
  const el = document.createElement('div');
  el.className = 'toast' + (type ? ' ' + type : '');
  el.textContent = msg;
  document.getElementById('toast-container').appendChild(el);
  setTimeout(() => el.remove(), 4200);
}
function openModal(id) { document.getElementById(id).classList.remove('hidden'); }
function closeModal(id) { document.getElementById(id).classList.add('hidden'); }

function showConfirm(message) {
  return new Promise(resolve => {
    document.getElementById('confirm-modal-message').textContent = message;
    const ok  = document.getElementById('confirm-modal-ok');
    const cancel = document.getElementById('confirm-modal-cancel');
    const done = val => { closeModal('modal-confirm'); ok.onclick = null; cancel.onclick = null; resolve(val); };
    ok.onclick = () => done(true);
    cancel.onclick = () => done(false);
    openModal('modal-confirm');
  });
}

function showPrompt(message, placeholder) {
  return new Promise(resolve => {
    document.getElementById('prompt-modal-message').textContent = message;
    const input  = document.getElementById('prompt-modal-input');
    const ok     = document.getElementById('prompt-modal-ok');
    const cancel = document.getElementById('prompt-modal-cancel');
    input.value = ''; input.placeholder = placeholder || '';
    const done = val => { closeModal('modal-prompt'); ok.onclick = null; cancel.onclick = null; resolve(val); };
    ok.onclick = () => done(input.value);
    cancel.onclick = () => done(null);
    openModal('modal-prompt');
    setTimeout(() => input.focus(), 50);
  });
}
async function handleBidStatusChange(select) {
  const bidId = document.getElementById('editor-bid-id').value;
  const currentStatus = document.getElementById('editor-bid-status').value;
  const chosen = select.value;

  if (!bidId) return; // new bid — no immediate action

  if (chosen === 'closed' && currentStatus !== 'Closed') {
    if (!['Published'].includes(currentStatus)) {
      toast('Bid must be Published before it can be closed.', 'error');
      select.value = 'open';
      return;
    }
    // Send OTP then show modal
    select.disabled = true;
    let sendRes;
    try { sendRes = await gsRun('sendActionOTP', SESSION.token); }
    catch (e) { toast(e.message || 'Failed to send verification code.', 'error'); select.value = 'open'; select.disabled = false; return; }
    select.disabled = false;
    if (!sendRes.success) { toast(sendRes.message || 'Failed to send code.', 'error'); select.value = 'open'; return; }

    const otp = await showActionOTP(sendRes.maskedEmail,
      'A verification code was sent to ' + sendRes.maskedEmail + '. Enter it to close this bid opportunity.');
    if (otp === null) { select.value = 'open'; return; } // cancelled — revert

    try {
      await gsRun('setBidSubmissionStatus', SESSION.token, bidId, true, otp);
      document.getElementById('editor-bid-status').value = 'Closed';
      toast('Bid status set to Closed.', 'success');
      PUBLIC_BIDS = []; loadPublicBoard(); loadMyBids();
    } catch (e) {
      toast(e.message || 'Failed to close bid.', 'error');
      select.value = 'open'; // revert on failure
    }

  } else if (chosen === 'open' && currentStatus === 'Closed') {
    // Reopen immediately — no OTP
    try {
      await gsRun('setBidSubmissionStatus', SESSION.token, bidId, false);
      document.getElementById('editor-bid-status').value = 'Published';
      // Also update the Publish/Unpublish toggle button
      document.getElementById('editor-publish-toggle-btn').textContent = 'Unpublish';
      toast('Bid status set to Open.', 'success');
      PUBLIC_BIDS = []; loadPublicBoard(); loadMyBids();
    } catch (e) {
      toast(e.message || 'Failed to reopen bid.', 'error');
      select.value = 'closed'; // revert on failure
    }
  }
}

function showPublishPassword() {
  return new Promise(resolve => {
    const input  = document.getElementById('publish-pwd-input');
    const errEl  = document.getElementById('publish-pwd-error');
    const btnOk  = document.getElementById('publish-pwd-ok');
    const btnCan = document.getElementById('publish-pwd-cancel');
    input.value = '';
    errEl.textContent = '';
    openModal('modal-publish-password');
    setTimeout(() => input.focus(), 100);
    const done = val => { closeModal('modal-publish-password'); btnOk.onclick = null; btnCan.onclick = null; input.onkeydown = null; resolve(val); };
    btnOk.onclick  = () => { const v = input.value; if (!v) { errEl.textContent = 'Password is required.'; return; } done(v); };
    btnCan.onclick = () => done(null);
    input.onkeydown = e => { if (e.key === 'Enter') btnOk.click(); };
  });
}

function fileToBase64(file) {
  return new Promise((resolve, reject) => {
    const reader = new FileReader();
    reader.onload = () => resolve(reader.result.split(',')[1]);
    reader.onerror = reject;
    reader.readAsDataURL(file);
  });
}

// ── INIT ───────────────────────────────────────────────────────
document.addEventListener('DOMContentLoaded', init);

async function init() {
  const savedToken = localStorage.getItem('bh_token');
  try {
    const data = await gsRun('getInitData', savedToken || '');
    CATEGORIES                   = data.categories || [];
    DOCUMENT_TYPES               = data.documentTypes || [];
    BID_DOCUMENT_TYPES           = data.bidDocumentTypes || [];
    BID_SUBMISSION_DOCUMENT_TYPES = data.bidSubmissionDocumentTypes || [];
    populateCategorySelects();

    if (savedToken) {
      if (data.boot) {
        SESSION.token = savedToken;
        SESSION.user  = data.boot.user;
        window._boot  = data.boot;
      } else {
        localStorage.removeItem('bh_token'); // expired/invalid
      }
    } else if (data.publicBids) {
      PUBLIC_BIDS = data.publicBids; // pre-loaded — no second round-trip needed
    }
  } catch (e) {
    console.error('init failed:', e);
    if (savedToken) localStorage.removeItem('bh_token');
  }
  renderNav();
  routeToView();
}

function populateCategorySelects() {
  const ids = ['vendor-category-filter', 'apply-businessCategory', 'editor-category', 'addv-businessCategory'];
  ids.forEach(id => {
    const sel = document.getElementById(id);
    if (!sel) return;
    CATEGORIES.forEach(c => {
      const opt = document.createElement('option');
      opt.value = c; opt.textContent = c;
      sel.appendChild(opt);
    });
  });
}

function renderNav() {
  const actions = document.getElementById('nav-actions');
  const btnSA = document.getElementById('btn-staff-access');
  if (!SESSION.token) {
    actions.innerHTML = '';
    if (btnSA) btnSA.onclick = function() { openModal('modal-login'); };
  } else {
    const u = SESSION.user;
    actions.innerHTML = `
      <span class="who">${escapeHtml(u.fullName || u.email)} · ${roleLabel(u.role)}</span>
      <button class="btn btn-ghost btn-sm" onclick="doLogout()">Logout</button>`;
    if (btnSA) btnSA.onclick = function() { routeToView(); };
  }
}

function routeToView() {
  document.getElementById('view-public').classList.add('hidden');
  document.getElementById('view-vendor').classList.add('hidden');
  document.getElementById('view-staff').classList.add('hidden');
  document.getElementById('view-help').classList.add('hidden');
  document.getElementById('public-hero').classList.add('hidden');

  if (!SESSION.token) {
    document.getElementById('view-public').classList.remove('hidden');
    document.getElementById('public-hero').classList.remove('hidden');
    loadPublicBoard();
    return;
  }
  if (SESSION.user.role === 'vendor') {
    document.getElementById('view-vendor').classList.remove('hidden');
    switchTab('vendor', 'v-status');
  } else {
    document.getElementById('view-staff').classList.remove('hidden');
    configureStaffTabsForRole(SESSION.user.role);
    const u = SESSION.user;
    document.getElementById('admin-user-chip').innerHTML =
      `<div class="admin-chip">
         <span class="admin-chip-name">${escapeHtml(u.fullName || u.email)}</span>
         <span class="admin-chip-role">${escapeHtml(roleLabel(u.role))}</span>
       </div>`;
  }
}

function goHome() {
  ['view-vendor','view-staff','view-help'].forEach(id => document.getElementById(id).classList.add('hidden'));
  document.getElementById('view-public').classList.remove('hidden');
  document.getElementById('public-hero').classList.remove('hidden');
  loadPublicBoard();
}

function showHelp() {
  document.getElementById('view-public').classList.add('hidden');
  document.getElementById('view-vendor').classList.add('hidden');
  document.getElementById('view-staff').classList.add('hidden');
  document.getElementById('public-hero').classList.add('hidden');
  document.getElementById('view-help').classList.remove('hidden');
}

function switchHelpTab(tabId) {
  document.querySelectorAll('#view-help .tab').forEach(b => b.classList.toggle('active', b.dataset.helpTab === tabId));
  document.querySelectorAll('#view-help .help-panel').forEach(p => p.classList.add('hidden'));
  document.getElementById('help-panel-' + tabId).classList.remove('hidden');
}

async function doLogout() {
  try { await gsRun('logout', SESSION.token); } catch (e) { /* ignore */ }
  localStorage.removeItem('bh_token');
  SESSION = { token: null, user: null };
  renderNav();
  routeToView();
}

// ── TABS ─────────────────────────────────────────────────────
function switchTab(scope, tabId) {
  const viewEl = document.getElementById(scope === 'staff' ? 'view-staff' : 'view-vendor');
  viewEl.querySelectorAll('.tab').forEach(b => b.classList.toggle('active', b.dataset.tab === tabId));
  viewEl.querySelectorAll('.tab-panel').forEach(p => p.classList.add('hidden'));
  const panel = document.getElementById(`${scope}-panel-${tabId}`);
  if (panel) panel.classList.remove('hidden');
  loadTabData(scope, tabId);
}

function configureStaffTabsForRole(role) {
  const cpd = role === 'cpd_admin' || role === 'cpd_officer';
  const admin = role === 'cpd_admin';
  document.querySelectorAll('#staff-tabs .tab').forEach(btn => {
    const tab = btn.dataset.tab;
    if (['s-approvals', 's-inquiries'].includes(tab)) btn.style.display = cpd ? '' : 'none';
    if (tab === 's-vendors') btn.style.display = 'none';
    if (['s-users', 's-audit'].includes(tab)) btn.style.display = admin ? '' : 'none';
  });
  const newBidBtn = document.getElementById('new-bid-btn');
  if (newBidBtn) newBidBtn.style.display = cpd ? '' : 'none';
  switchTab('staff', 's-mybids');
}

function loadTabData(scope, tabId) {
  if (scope === 'vendor') {
    if (tabId === 'v-status') return loadVendorStatus();
    if (tabId === 'v-browse') return loadVendorBoard();
    if (tabId === 'v-inquiries') return loadMyInquiries();
  } else {
    if (tabId === 's-mybids') return loadMyBids();
    if (tabId === 's-loi') return loadLOI();
    if (tabId === 's-approvals') return loadApprovals();
    if (tabId === 's-vendors') return loadVendorApplications();
    if (tabId === 's-inquiries') return loadInquiriesForReview();
    if (tabId === 's-users') return loadUsers();
    if (tabId === 's-audit') return loadAuditLog();
  }
}

// ── STAFF: LETTERS OF INTENT ─────────────────────────────────
let LOI_CACHE = [];
let LOI_PAGE  = 1;
const LOI_PAGE_SIZE = 10;

async function loadLOI() {
  const el = document.getElementById('staff-loi-table');
  el.innerHTML = '<p class="hint">Loading…</p>';
  try {
    const res = await gsRun('getLettersOfIntent', SESSION.token);
    LOI_CACHE = res.lois;
    LOI_PAGE  = 1;
    renderLOITable();
  } catch (e) { el.innerHTML = '<p class="error-text">Failed to load submissions. ' + escapeHtml(e.message || String(e)) + '</p>'; }
}

function renderLOITable() {
  const el = document.getElementById('staff-loi-table');
  if (!LOI_CACHE.length) { el.innerHTML = '<div class="empty-state">No letters of intent submitted yet.</div>'; return; }
  const total = LOI_CACHE.length;
  const totalPages = Math.ceil(total / LOI_PAGE_SIZE);
  LOI_PAGE = Math.min(Math.max(LOI_PAGE, 1), totalPages);
  const start = (LOI_PAGE - 1) * LOI_PAGE_SIZE;
  const page  = LOI_CACHE.slice(start, start + LOI_PAGE_SIZE);

  const tableHtml = `<table>
    <thead><tr>
      <th>#</th><th>Company</th><th>Contact Person</th><th>Email</th><th>Contact No.</th><th>Subject</th><th>Submitted</th><th></th>
    </tr></thead>
    <tbody>${page.map((r, i) => {
      const subject = r.bidTitle ? `${r.bidTitle} — ${r.companyName}` : '—';
      return `<tr>
      <td style="color:var(--ink-faint);font-size:12px;">${start + i + 1}</td>
      <td style="font-weight:600;">${escapeHtml(r.companyName)}</td>
      <td>${escapeHtml(r.contactPerson)}</td>
      <td><a href="mailto:${escapeHtml(r.contactEmail)}" style="color:var(--g600);">${escapeHtml(r.contactEmail)}</a></td>
      <td>${escapeHtml(r.contactNumber)}</td>
      <td style="font-size:12px;color:var(--ink-soft);">${escapeHtml(subject)}</td>
      <td style="white-space:nowrap;">${fmtDate(r.submittedOn)}</td>
      <td style="white-space:nowrap;display:flex;gap:6px;">
        <button class="btn btn-sm btn-outline" data-idx="${start + i}" onclick="openLOIDetail(+this.dataset.idx)">View</button>
        <button class="btn btn-sm btn-outline" data-email="${escapeHtml(r.contactEmail)}" data-company="${escapeHtml(r.companyName)}" onclick="openLOIEmail(this.dataset.email,this.dataset.company)">Send Email</button>
      </td>
    </tr>`;}).join('')}</tbody>
  </table>`;

  const pagerHtml = totalPages > 1 ? `
    <div class="pub-pager" style="margin-top:16px;">
      <button class="pub-pager-btn" onclick="loiGoPage(${LOI_PAGE - 1})" ${LOI_PAGE === 1 ? 'disabled' : ''}>‹ Prev</button>
      <span class="pub-pager-info">Page ${LOI_PAGE} of ${totalPages} &nbsp;·&nbsp; ${total} submission${total !== 1 ? 's' : ''}</span>
      <button class="pub-pager-btn" onclick="loiGoPage(${LOI_PAGE + 1})" ${LOI_PAGE === totalPages ? 'disabled' : ''}>Next ›</button>
    </div>` : `<p class="hint" style="margin-top:12px;text-align:right;">${total} submission${total !== 1 ? 's' : ''}</p>`;

  el.innerHTML = tableHtml + pagerHtml;
}

function loiGoPage(page) { LOI_PAGE = page; renderLOITable(); }

async function awardLOIAction(loiId, company) {
  if (!await showConfirm('Award this bid to ' + (company || 'this company') + '?\n\nThis declares them as the winning bidder for this opportunity.')) return;
  try {
    await gsRun('awardLOI', SESSION.token, loiId);
    toast('Marked as Awarded.', 'success');
    loadLOI();
    // Refresh public board so the Awarded Bids count on the homepage updates
    PUBLIC_BIDS = [];
    loadPublicBoard();
  }
  catch (e) { toast(e.message || 'Failed to award.', 'error'); }
}

async function revokeAwardAction(loiId, company) {
  if (!await showConfirm('Undo the award for ' + (company || 'this submission') + '?\n\nThis action requires OTP verification and will remove their Awarded status.')) return;

  // Send OTP to logged-in user's email
  let sendResult;
  try { sendResult = await gsRun('sendActionOTP', SESSION.token); }
  catch (e) { toast(e.message || 'Failed to send verification code.', 'error'); return; }
  if (!sendResult.success) { toast(sendResult.message || 'Failed to send verification code.', 'error'); return; }

  // Show OTP modal
  const otp = await showActionOTP(sendResult.maskedEmail, 'A 6-digit verification code has been sent to ' + sendResult.maskedEmail + '. Enter it below to confirm the undo.');
  if (otp === null) return; // cancelled

  // Revoke with verified OTP
  try {
    await gsRun('revokeAward', SESSION.token, loiId, otp);
    toast('Award successfully revoked.', 'success');
    loadLOI();
    // Refresh public board so the Awarded Bids count on the homepage updates
    PUBLIC_BIDS = [];
    loadPublicBoard();
  }
  catch (e) { toast(e.message || 'Failed to revoke award.', 'error'); }
}

function showActionOTP(maskedEmail, message) {
  return new Promise(resolve => {
    const overlay  = document.getElementById('modal-action-otp');
    const msgEl    = document.getElementById('action-otp-message');
    const input    = document.getElementById('action-otp-input');
    const errorEl  = document.getElementById('action-otp-error');
    const btnOk    = document.getElementById('action-otp-confirm');
    const btnCancel= document.getElementById('action-otp-cancel');
    const btnResend= document.getElementById('action-otp-resend');

    msgEl.textContent = message || ('A 6-digit verification code has been sent to ' + maskedEmail + '. Enter it below to proceed.');
    input.value = '';
    errorEl.textContent = '';
    btnResend.textContent = 'Resend Code';
    btnResend.disabled = false;
    openModal('modal-action-otp');
    setTimeout(() => input.focus(), 100);

    let resendTimer = null;
    function startResendCooldown() {
      let secs = 60;
      btnResend.disabled = true;
      clearInterval(resendTimer);
      resendTimer = setInterval(() => {
        secs--;
        btnResend.textContent = 'Resend (' + secs + 's)';
        if (secs <= 0) { clearInterval(resendTimer); btnResend.textContent = 'Resend Code'; btnResend.disabled = false; }
      }, 1000);
    }
    startResendCooldown();

    function cleanup() {
      clearInterval(resendTimer);
      btnOk.onclick = null; btnCancel.onclick = null; btnResend.onclick = null;
      closeModal('modal-action-otp');
    }

    btnCancel.onclick = () => { cleanup(); resolve(null); };

    btnOk.onclick = () => {
      const code = input.value.trim();
      if (code.length !== 6 || !/^\d+$/.test(code)) { errorEl.textContent = 'Enter a valid 6-digit code.'; return; }
      cleanup();
      resolve(code);
    };

    btnResend.onclick = async () => {
      errorEl.textContent = '';
      btnResend.disabled = true;
      try {
        const r = await gsRun('sendActionOTP', SESSION.token);
        if (r.success) { startResendCooldown(); errorEl.textContent = ''; }
        else { errorEl.textContent = r.message || 'Could not resend. Please wait.'; btnResend.disabled = false; }
      } catch (e) { errorEl.textContent = e.message || 'Failed to resend.'; btnResend.disabled = false; }
    };

    input.onkeydown = e => { if (e.key === 'Enter') btnOk.click(); };
  });
}

function openLOIDetail(idx) {
  const r = LOI_CACHE[idx];
  if (!r) return;
  const subject = r.bidTitle ? `${r.bidTitle} — ${r.companyName}` : '—';
  document.getElementById('loi-detail-content').innerHTML = `
    <div style="display:grid;grid-template-columns:1fr 1fr;gap:12px 24px;margin-bottom:16px;">
      <div><div class="field-label">Company Name</div><div style="font-weight:600;">${escapeHtml(r.companyName)}</div></div>
      <div><div class="field-label">Contact Person</div><div>${escapeHtml(r.contactPerson)}</div></div>
      <div><div class="field-label">Email</div><div><a href="mailto:${escapeHtml(r.contactEmail)}" style="color:var(--g600);">${escapeHtml(r.contactEmail)}</a></div></div>
      <div><div class="field-label">Contact Number</div><div>${escapeHtml(r.contactNumber)}</div></div>
      <div><div class="field-label">Bid Opportunity</div><div>${escapeHtml(r.bidTitle || '—')}</div></div>
      <div><div class="field-label">Submitted On</div><div>${fmtDate(r.submittedOn)}</div></div>
    </div>
    <div style="display:flex;gap:10px;margin-top:8px;">
      <button class="btn btn-primary" data-email="${escapeHtml(r.contactEmail)}" data-company="${escapeHtml(r.companyName)}" onclick="closeModal('modal-loi-detail');openLOIEmail(this.dataset.email,this.dataset.company)">Send Email</button>
      <button class="btn btn-outline" onclick="closeModal('modal-loi-detail')">Close</button>
    </div>`;
  openModal('modal-loi-detail');
}

async function submitBidLOI(btn) {
  const errEl   = document.getElementById('bid-loi-error');
  const company = document.getElementById('bid-loi-company').value.trim();
  const person  = document.getElementById('bid-loi-person').value.trim();
  const email   = document.getElementById('bid-loi-email').value.trim();
  const number  = document.getElementById('bid-loi-number').value.trim();
  const bidTitle = document.getElementById('bid-loi-title').value;
  errEl.textContent = '';
  if (!company) { errEl.textContent = 'Company name is required.'; return; }
  if (!person)  { errEl.textContent = 'Contact person is required.'; return; }
  if (!email)   { errEl.textContent = 'Contact email is required.'; return; }
  if (!number)  { errEl.textContent = 'Contact number is required.'; return; }
  btn.disabled = true; btn.textContent = 'Submitting…';
  try {
    await gsRun('submitLetterOfIntent', { companyName: company, contactPerson: person, contactEmail: email, contactNumber: number, bidTitle });
    toast('Letter of Intent submitted successfully.', 'success');
    ['bid-loi-company','bid-loi-person','bid-loi-email','bid-loi-number'].forEach(id => document.getElementById(id).value = '');
    btn.textContent = 'Submitted ✓';
    return;
  } catch (e) { errEl.textContent = e.message || 'Submission failed. Please try again.'; }
  btn.disabled = false; btn.textContent = 'Submit Letter of Intent';
}

function openLOIEmail(email, company) {
  document.getElementById('loi-email-to').value = email;
  document.getElementById('loi-email-subject').value = 'Re: Letter of Intent — ' + company;
  document.getElementById('loi-email-body').value = '';
  document.getElementById('loi-email-error').textContent = '';
  openModal('modal-loi-email');
}

async function sendLOIEmail(btn) {
  const errEl   = document.getElementById('loi-email-error');
  const to      = document.getElementById('loi-email-to').value.trim();
  const subject = document.getElementById('loi-email-subject').value.trim();
  const body    = document.getElementById('loi-email-body').value.trim();
  errEl.textContent = '';

function renderPublicHeroStats(bids) {
  const count = bids.filter(b => b.status === 'Published' || b.status === 'Closed').length;
  document.getElementById('pub-tab-bar').innerHTML = `
    <div class="open-opps-header">
      <div class="open-opps-title">Open Opportunities</div>
      <span class="open-opps-count">${count} record${count !== 1 ? 's' : ''}</span>
    </div>`;
  PUBLIC_FILTER = 'open';
  applyPublicFilter();
}

function togglePublicFilter(type) {
  PUBLIC_FILTER = type; PUBLIC_PAGE = 1;
  applyPublicFilter();
}

function applyPublicFilter() {
  const content = document.getElementById('pub-tab-content');
  content.classList.remove('hidden');

  let filtered, emptyMsg;
  filtered = PUBLIC_BIDS.filter(b => b.status === 'Published' || b.status === 'Closed');
  emptyMsg = 'No bid opportunities at this time.';

  if (!filtered.length) { content.innerHTML = `<div class="bid-list-empty">${emptyMsg}</div>`; return; }

  const totalPages = Math.ceil(filtered.length / PUBLIC_PAGE_SIZE);
  PUBLIC_PAGE = Math.min(Math.max(PUBLIC_PAGE, 1), totalPages);
  const start = (PUBLIC_PAGE - 1) * PUBLIC_PAGE_SIZE;
  const page  = filtered.slice(start, start + PUBLIC_PAGE_SIZE);

  const listHtml = `<div>` +
    page.map((b, i) => {
      const isAwarded = b.status === 'Closed' && b.outcome === 'Awarded';
      const isClosed = b.status === 'Closed' && !isAwarded;
      const rowBg = i % 2 === 0 ? '#ffffff' : '#F5F7FA';
      return `
    <div class="bid-list-item" style="background:${rowBg};border-radius:0;border-left:none;border-right:none;border-top:none;border-bottom:1px solid #e5e7eb;margin-bottom:0;${isClosed ? 'opacity:.85;' : ''}" onclick="openBidDetail('${b.bidId}')">
      <div class="bli-ref">${escapeHtml(b.referenceNo || '—')}</div>
      <div class="bli-body" style="position:relative;">
        <div class="bli-title">${escapeHtml(b.title)}</div>
        ${isClosed
          ? `<div style="display:inline-block;margin-top:5px;padding:3px 10px;background:#dc2626;color:#fff;border-radius:4px;font-size:12px;font-weight:800;letter-spacing:.08em;text-transform:uppercase;">BID CLOSED</div>`
          : isAwarded
            ? `<div class="bli-meta" style="color:#166534;font-weight:600;">🏆 Awarded</div>`
            : `<div class="bli-meta">${escapeHtml(b.description || '—')}</div>`}
      </div>
      <div class="bli-arrow">›</div>
    </div>`;
    }).join('') + `</div>`;

  const pagerHtml = totalPages > 1 ? `
    <div class="pub-pager">
      <button class="pub-pager-btn" onclick="publicGoPage(${PUBLIC_PAGE - 1})" ${PUBLIC_PAGE === 1 ? 'disabled' : ''}>‹ Prev</button>
      <span class="pub-pager-info">Page ${PUBLIC_PAGE} of ${totalPages} &nbsp;·&nbsp; ${filtered.length} record${filtered.length !== 1 ? 's' : ''}</span>
      <button class="pub-pager-btn" onclick="publicGoPage(${PUBLIC_PAGE + 1})" ${PUBLIC_PAGE === totalPages ? 'disabled' : ''}>Next ›</button>
    </div>` : '';

  content.innerHTML = listHtml + pagerHtml;
}

function publicGoPage(page) {
  PUBLIC_PAGE = page;
  applyPublicFilter();
  document.getElementById('pub-tab-content').scrollIntoView({ behavior: 'smooth', block: 'nearest' });
}

function renderBidGrid(container, bids, vendorMode) {
  if (!bids.length) { container.innerHTML = '<div class="empty-state">No bid opportunities found.</div>'; return; }
  container.innerHTML = bids.map(b => `
    <div class="card bid-card" onclick="openBidDetail('${b.bidId}')">
      <span class="stamp ${stampClass(b.status)}">${escapeHtml(b.status)}${b.outcome ? ' · ' + escapeHtml(b.outcome) : ''}</span>
      <div class="control-no" style="margin-top:6px;">${escapeHtml(b.referenceNo || '')}</div>
      <h3>${escapeHtml(b.title)}</h3>
      <div class="meta">📅 Deadline: ${fmtDate(b.submissionDeadline)}</div>
    </div>`).join('');
}

async function openBidDetail(bidId) {
  CURRENT_BID_ID = bidId;
  try {
    const res = await gsRun('getBidById', bidId);
    if (!res.success) { toast(res.message, 'error'); return; }
    let vendorProfile = null;
    let mySubmission = null;
    if (SESSION.token && SESSION.user.role === 'vendor') {
      try {
        vendorProfile = (await gsRun('getMyVendorProfile', SESSION.token)).profile;
        const subs = (await gsRun('getMyBidSubmissions', SESSION.token)).submissions;
        mySubmission = subs.find(s => s.BidID === bidId) || null;
      } catch (e) { /* non-fatal — submission section just won't show */ }
    }
    renderBidDetail(res.bid, res.inquiries, vendorProfile, mySubmission);
    openModal('modal-bid-detail');
  } catch (e) { toast('Failed to load bid opportunity.', 'error'); }
}

function renderBidDetail(bid, inquiries, vendorProfile, mySubmission) {
  let html = `
    <span class="stamp ${stampClass(bid.status)}">${escapeHtml(bid.status)}${bid.outcome ? ' · ' + escapeHtml(bid.outcome) : ''}</span>
    <div class="control-no" style="margin-top:8px;">${escapeHtml(bid.referenceNo || '')}</div>
    <h2>${escapeHtml(bid.title)}</h2>
    <div style="margin-top:10px;"><b>📅 Submission Deadline:</b> ${fmtDate(bid.submissionDeadline)}</div>
    <div class="hint" style="margin-top:6px;">Published: ${fmtDate(bid.publishedOn)}${bid.closedOn ? ' · Closed: ' + fmtDate(bid.closedOn) : ''}</div>`;

  html += `<h4 style="margin-top:16px;">Description</h4>
    <p style="white-space:pre-wrap;">${escapeHtml(bid.description || '—')}</p>`;

  const isAwarded = bid.status === 'Closed' && bid.outcome === 'Awarded';

  if (isAwarded) {
    html += `
      <div style="margin-top:20px;padding:12px 16px;background:#f0fdf4;border:1.5px solid #86efac;border-radius:8px;font-size:13px;color:#166534;font-weight:600;">
        🏆 This bid opportunity has been awarded. No further submissions are being accepted.
      </div>`;
  } else if (bid.status === 'Closed') {
    html += `
      <div style="margin-top:20px;padding:12px 16px;background:#fef2f2;border:1.5px solid #fca5a5;border-radius:8px;font-size:13px;color:#991b1b;font-weight:600;">
        🔒 This bid opportunity is now closed. No further submissions are being accepted.
      </div>`;
  }

  let showSubmissionSlots = false;
  if (!isAwarded) {
    if (SESSION.token && SESSION.user.role === 'vendor' && bid.status === 'Published') {
      html += `<h4 style="margin-top:16px;">Submit Your Bid</h4>`;
      const isAccredited = vendorProfile && vendorProfile.AccreditationStatus === 'Approved';
      if (!isAccredited) {
        const statusLabel = vendorProfile ? (vendorProfile.AccreditationStatus === 'ChangesRequested' ? 'Changes Requested' : vendorProfile.AccreditationStatus) : 'Not on file';
        html += `<p class="hint">Only accredited vendors can submit a bid. Your current accreditation status:
          <span class="stamp ${stampClass(vendorProfile ? vendorProfile.AccreditationStatus : 'Pending')}">${escapeHtml(statusLabel)}</span></p>`;
      } else {
        SUBMISSION_DOCS = mySubmission ? Object.assign({}, mySubmission.documents) : {};
        html += mySubmission
          ? `<p class="hint">You submitted this bid on ${fmtDate(mySubmission.SubmittedOn)}${mySubmission.LastUpdated !== mySubmission.SubmittedOn ? ' · last updated ' + fmtDate(mySubmission.LastUpdated) : ''}. Replace any document below and resubmit before the deadline if needed.</p>`
          : `<p class="hint">Upload your proposal documents, then submit before the deadline.</p>`;
        html += `<div id="submission-doc-slots"></div>
          <button class="btn btn-primary" onclick="submitBidProposalAction('${bid.bidId}')">${mySubmission ? 'Resubmit Bid' : 'Submit Bid'}</button>
          <div id="submission-error" class="error-text"></div>`;
        showSubmissionSlots = true;
      }
    } else if (!SESSION.token && bid.status === 'Published') {
      html += `<h4 style="margin-top:16px;">Submit Your Bid</h4><p class="hint">Sign in as an accredited vendor to submit a bid.</p>`;
    }

    // LOI inline form — visible to public and vendors, hidden for staff
    const isStaff = SESSION.token && ['cpd_admin','cpd_officer','proponent'].includes(SESSION.user.role);
    if (!isStaff && bid.status === 'Published') {
      html += `
        <div style="margin-top:20px;padding-top:16px;border-top:1px solid var(--line);">
          <h4 style="margin-bottom:4px;">Interested in this bid?</h4>
          <p class="hint" style="margin-bottom:14px;">Fill in your details below and submit a Letter of Intent. Our procurement team will reach out to you.</p>
          <input type="hidden" id="bid-loi-title" value="${escapeHtml(bid.title)}">
          <div style="margin-bottom:12px;">
            <label class="field-label">Project Name</label>
            <input type="text" id="bid-loi-project" value="${escapeHtml(bid.title)}" readonly style="background:var(--paper-2);color:var(--ink-faint);cursor:default;">
          </div>
          <div style="display:grid;grid-template-columns:1fr 1fr;gap:12px;">
            <div><label class="field-label">Company Name <span style="color:var(--danger)">*</span></label>
              <input type="text" id="bid-loi-company" placeholder="e.g. ABC Trading Corp."></div>
            <div><label class="field-label">Contact Person <span style="color:var(--danger)">*</span></label>
              <input type="text" id="bid-loi-person" placeholder="Full name"></div>
            <div><label class="field-label">Email <span style="color:var(--danger)">*</span></label>
              <input type="email" id="bid-loi-email" placeholder="your@email.com"></div>
            <div><label class="field-label">Contact Number <span style="color:var(--danger)">*</span></label>
              <input type="tel" id="bid-loi-number" placeholder="e.g. 09xx-xxx-xxxx"></div>
          </div>
          <p id="bid-loi-error" class="error-text" style="margin-top:8px;min-height:18px;"></p>
          <button class="btn btn-primary" style="margin-top:4px;" onclick="submitBidLOI(this)">Submit Letter of Intent</button>
        </div>`;
    }
  }

  document.getElementById('bid-detail-content').innerHTML = html;
  if (showSubmissionSlots) renderSubmissionDocSlots();
}

function renderSubmissionDocSlots() {
  const container = document.getElementById('submission-doc-slots');
  container.innerHTML = BID_SUBMISSION_DOCUMENT_TYPES.map(t => `
    <div class="doc-slot" id="submission-doc-slot-${t.key}">
      <div class="doc-info">
        <div class="doc-label">${escapeHtml(t.label)}${t.required ? ' <span class="req">*</span>' : ''}</div>
        ${t.hint ? `<div class="doc-hint">${escapeHtml(t.hint)}</div>` : ''}
        <div class="doc-status ${SUBMISSION_DOCS[t.key] && SUBMISSION_DOCS[t.key].url ? 'uploaded' : ''}" id="submission-doc-status-${t.key}">
          ${SUBMISSION_DOCS[t.key] && SUBMISSION_DOCS[t.key].url ? escapeHtml(SUBMISSION_DOCS[t.key].name) + ' — on file' : 'No file chosen'}
        </div>
      </div>
      <input type="file" accept=".pdf,application/pdf" onchange="handleSubmissionDocFile('${t.key}', this)">
    </div>`).join('');
}

async function handleSubmissionDocFile(docKey, inputEl) {
  const file = inputEl.files[0];
  if (!file) return;
  const statusEl = document.getElementById('submission-doc-status-' + docKey);
  statusEl.textContent = 'Uploading ' + file.name + '…';
  statusEl.className = 'doc-status uploading';
  try {
    const base64 = await fileToBase64(file);
    const info = await gsRun('uploadBidSubmissionDocument', SESSION.token, base64, file.name, file.type);
    SUBMISSION_DOCS[docKey] = info;
    statusEl.textContent = info.name + ' — uploaded';
    statusEl.className = 'doc-status uploaded';
  } catch (err) {
    statusEl.textContent = file.name + ' — failed: ' + (err.message || String(err));
    statusEl.className = 'doc-status failed';
    inputEl.value = '';
  }
}

async function submitBidProposalAction(bidId) {
  const errEl = document.getElementById('submission-error');
  errEl.textContent = '';
  try {
    await gsRun('submitBidProposal', SESSION.token, bidId, SUBMISSION_DOCS);
    toast('Your bid has been submitted.', 'success');
    closeModal('modal-bid-detail');

}

function renderVendorStatusPanel(p) {
  const el = document.getElementById('vendor-panel-v-status');
  if (!p) { el.innerHTML = '<div class="empty-state">No accreditation record found.</div>'; return; }
  const statusLabel = p.AccreditationStatus === 'ChangesRequested' ? 'Changes Requested' : p.AccreditationStatus;
  let html = `
    <div class="card">
      <span class="stamp ${stampClass(p.AccreditationStatus)}">${escapeHtml(statusLabel)}</span>
      ${p.AccreditationNo ? `<div class="control-no" style="margin-top:8px;">${escapeHtml(p.AccreditationNo)}</div>` : ''}
      <h3 style="margin-top:8px;">${escapeHtml(p.CompanyName)}</h3>
      <p class="hint">${escapeHtml(p.ContactPerson)} · ${escapeHtml(p.ContactNumber)} · ${escapeHtml(p.Email)}</p>
      ${p.SubmittedOn ? `<p class="hint">Submitted: ${fmtDate(p.SubmittedOn)}</p>` : ''}
      ${p.ReviewedOn ? `<p class="hint">Reviewed: ${fmtDate(p.ReviewedOn)} by ${escapeHtml(p.ReviewedBy)}</p>` : ''}
      ${p.ReviewNotes ? `<p><b>Notes:</b> ${escapeHtml(p.ReviewNotes)}</p>` : ''}
      ${p.ExpiryDate ? `<p class="hint">Valid until: ${fmtDate(p.ExpiryDate)}</p>` : ''}
      <h4 style="margin-top:12px;">Submitted Documents</h4>
      ${renderDocList(p.documents, DOCUMENT_TYPES)}
    </div>`;

  const canEdit = ['Pending', 'ChangesRequested'].includes(p.AccreditationStatus);
  if (canEdit) {
    REVISION_DOCS = Object.assign({}, p.documents || {});
    html += `
      <div class="card">
        <h3>${p.AccreditationStatus === 'ChangesRequested' ? 'Update Your Application' : 'Edit Your Application'}</h3>
        <p class="hint">${p.AccreditationStatus === 'ChangesRequested'
          ? 'Fix the issue described above, then resubmit for another review.'

/** Renders the checklist of uploaded documents by type. Pass DOCUMENT_TYPES (vendor accreditation) or BID_DOCUMENT_TYPES (bid opportunities) for labels. */
function renderDocList(docsObj, types) {
  types = types || DOCUMENT_TYPES;
  if (!docsObj) return '<p class="hint">No documents on file.</p>';
  const items = types.filter(t => docsObj[t.key] && docsObj[t.key].url);
  if (!items.length) return '<p class="hint">No documents on file.</p>';
  return `<ul class="file-list">` + items.map(t =>
    `<li><a href="${docsObj[t.key].url}" target="_blank" rel="noopener">${escapeHtml(t.label)}</a></li>`
  ).join('') + `</ul>`;
}

function renderRevisionDocSlots() {
  const container = document.getElementById('revision-doc-slots');
  container.innerHTML = DOCUMENT_TYPES.map(t => `
    <div class="doc-slot" id="rev-doc-slot-${t.key}">
      <div class="doc-info">
        <div class="doc-label">${escapeHtml(t.label)}${t.required ? ' <span class="req">*</span>' : ''}</div>
        ${t.hint ? `<div class="doc-hint">${escapeHtml(t.hint)}</div>` : ''}
        <div class="doc-status ${REVISION_DOCS[t.key] && REVISION_DOCS[t.key].url ? 'uploaded' : ''}" id="rev-doc-status-${t.key}">
          ${REVISION_DOCS[t.key] && REVISION_DOCS[t.key].url ? escapeHtml(REVISION_DOCS[t.key].name) + ' — on file' : 'No file chosen'}
        </div>
      </div>
      <input type="file" accept=".pdf,application/pdf" onchange="handleRevisionDocFile('${t.key}', this)">
    </div>`).join('');
}

async function handleRevisionDocFile(docKey, inputEl) {
  const file = inputEl.files[0];
  if (!file) return;
  const statusEl = document.getElementById('rev-doc-status-' + docKey);
  statusEl.textContent = 'Uploading ' + file.name + '…';
  statusEl.className = 'doc-status uploading';
  try {
    const base64 = await fileToBase64(file);
    const info = await gsRun('uploadVendorDocumentAuthenticated', SESSION.token, base64, file.name, file.type);
    REVISION_DOCS[docKey] = info;
    statusEl.textContent = info.name + ' — uploaded';
    statusEl.className = 'doc-status uploaded';
  } catch (err) {
    statusEl.textContent = file.name + ' — failed: ' + (err.message || String(err));
    statusEl.className = 'doc-status failed';
    inputEl.value = '';
  }
}

function renderMyBidsTable(bids) {
  const el = document.getElementById('staff-mybids-table');
  if (!bids.length) { el.innerHTML = '<div class="empty-state">No bid opportunities yet.</div>'; return; }
  el.innerHTML = `<table style="table-layout:fixed;width:100%;">
    <colgroup>
      <col style="width:28%;">
      <col style="width:14%;">
      <col style="width:16%;">
      <col style="width:10%;">
      <col style="width:12%;">
      <col style="width:20%;">
    </colgroup>
    <thead><tr><th>Title</th><th>Category</th><th>Letter of Intent Submission Deadline</th><th>LETTER OF INTENT</th><th>STATUS</th><th>Actions</th></tr></thead><tbody>` +
    bids.map(b => {
      const isPublished = b.Status === 'Published';
      const isAwarded = b.Outcome === 'Awarded' || b.loiAwarded === true;
      const isClosed = b.Status === 'Closed' && !isAwarded;
      const currentVal = isAwarded ? 'Awarded' : isPublished ? 'Open' : isClosed ? 'Closed' : '';
      const dropdown = isAwarded
        ? `<span style="display:flex;align-items:center;gap:6px;">
             <span class="stamp stamp-green" style="font-size:11px;">Awarded</span>
             <button class="btn btn-sm" style="font-size:11px;padding:2px 8px;background:#fff;border:1px solid #d1d5db;color:#6b7280;" onclick="undoAwardAction('${b.BidID}')">Undo</button>
           </span>`
        : (isPublished || isClosed)
          ? `<select onchange="updateBidStatusInline('${b.BidID}', this.value, this)" style="font-size:12px;padding:3px 6px;border:1px solid #d1d5db;border-radius:5px;background:#fff;width:100%;">
              <option value="Open" ${currentVal === 'Open' ? 'selected' : ''}>Open</option>
              <option value="Closed" ${currentVal === 'Closed' ? 'selected' : ''}>Closed</option>
              <option value="Awarded" ${currentVal === 'Awarded' ? 'selected' : ''}>Awarded</option>
             </select>`
          : `<span class="hint">—</span>`;
      return `<tr>
        <td style="overflow:hidden;text-overflow:ellipsis;white-space:nowrap;" title="${escapeHtml(b.Title)}">${escapeHtml(b.Title)}</td>
        <td style="overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-size:12px;" title="${escapeHtml(b.Category)}">${escapeHtml(b.Category)}</td>
        <td style="white-space:nowrap;font-size:12px;">${fmtDate(b.SubmissionDeadline)}</td>
        <td style="text-align:center;font-weight:600;">${b.submissionCount || 0}</td>
        <td>${dropdown}</td>
        <td style="white-space:nowrap;">${bidActionsHtml(b)}</td>
      </tr>`;
    }).join('') + `</tbody></table>`;
}

async function updateBidStatusInline(bidId, newVal, selectEl) {
  const prev = selectEl.dataset.prev || selectEl.value;
  selectEl.dataset.prev = selectEl.value;
  try {
    if (newVal === 'Open') {
      await gsRun('setBidSubmissionStatus', SESSION.token, bidId, false);
      toast('Bid reopened to Open.', 'success');
    } else if (newVal === 'Closed') {
      await gsRun('closeBid', SESSION.token, bidId, 'No Award');
      toast('Bid closed.', 'success');
    } else if (newVal === 'Awarded') {
      await gsRun('closeBid', SESSION.token, bidId, 'Awarded');
      toast('Bid marked as Awarded.', 'success');
    }
    PUBLIC_BIDS = []; loadPublicBoard(); loadMyBids();
  } catch (e) {
    toast(e.message || 'Status update failed.', 'error');
    selectEl.value = prev;
  }
}

async function undoAwardAction(bidId) {
  let sendRes;
  try { sendRes = await gsRun('sendActionOTP', SESSION.token); }
  catch (e) { toast(e.message || 'Failed to send verification code.', 'error'); return; }
  if (!sendRes.success) { toast(sendRes.message || 'Failed to send code.', 'error'); return; }

  const otp = await showActionOTP(sendRes.maskedEmail,
    'A verification code was sent to ' + sendRes.maskedEmail + '. Enter it to undo this award.');
  if (otp === null) return;

  try {
    await gsRun('undoAwardBid', SESSION.token, bidId, otp);
    toast('Award successfully undone.', 'success');
    PUBLIC_BIDS = []; loadPublicBoard(); loadMyBids();
  } catch (e) {
    toast(e.message || 'Failed to undo award.', 'error');
  }
}

  document.getElementById('bid-editor-title').textContent = bidId ? 'Edit Bid Opportunity' : 'New Bid Opportunity';
  document.getElementById('editor-bid-status').value = '';
  document.getElementById('editor-submission-status-row').style.display = 'none';
  const toggleBtn = document.getElementById('editor-publish-toggle-btn');
  toggleBtn.textContent = 'Publish';
  if (bidId) {
    gsRun('getMyBids', SESSION.token).then(res => {
      const b = res.bids.find(x => x.BidID === bidId);
      if (!b) return;
      document.getElementById('editor-title').value = b.Title || '';
      document.getElementById('editor-category').value = b.Category || '';
      document.getElementById('editor-deadline').value = (b.SubmissionDeadline || '').slice(0, 16);
      document.getElementById('editor-description').value = b.Description || '';
      document.getElementById('editor-bid-status').value = b.Status || '';

      const statusSel = document.getElementById('editor-submission-status');

    ['editor-title', 'editor-deadline', 'editor-description'].forEach(id => document.getElementById(id).value = '');

async function saveBidEditor(action) {
  const errEl = document.getElementById('bid-editor-error');
  errEl.textContent = '';
  const bidId = document.getElementById('editor-bid-id').value;
  const d = {
    title: document.getElementById('editor-title').value.trim(),
    category: document.getElementById('editor-category').value,
    department: '',
    estimatedBudget: '',
    submissionDeadline: document.getElementById('editor-deadline').value,
    description: document.getElementById('editor-description').value.trim(),
    documents: {},
  };
  try {
    let id = bidId;
    if (bidId) { await gsRun('updateBid', SESSION.token, bidId, d); }
    else { const res = await gsRun('createBid', SESSION.token, d); id = res.bidId; }
    if (action === 'publish') {
      const currentStatus = document.getElementById('editor-bid-status').value;
      if (currentStatus === 'Closed') {
        // Closed → Published requires password confirmation
        const pwd = await showPublishPassword();
        if (pwd === null) return; // cancelled
        try { await gsRun('publishBid', SESSION.token, id, pwd); }
        catch (e) {
          // Show error back in the password modal context
          errEl.textContent = e.message || 'Failed to publish.';
          return;
        }
      } else {
        await gsRun('publishBid', SESSION.token, id, null);
      }
    }
    else if (action === 'unpublish') await gsRun('unpublishBid', SESSION.token, id);
    // (Bid Status Open/Closed is handled immediately via handleBidStatusChange — not on save)
    closeModal('modal-bid-editor');
    toast('Bid opportunity saved.', 'success');
    loadMyBids();
    PUBLIC_BIDS = []; loadPublicBoard();
  } catch (e) { errEl.textContent = e.message || 'Failed to save bid opportunity.'; }
}

async function reviewVendorAction(vendorId, decision) {

    const label = decision === 'Rejected' ? 'Reason for rejection:' : 'Describe what needs to be corrected:';

  }
  try {
    await gsRun('reviewAccreditation', SESSION.token, vendorId, decision, notes, '');
    const verbMap = { Approved: 'approved', Rejected: 'rejected', ChangesRequested: 'sent back for changes' };
    toast('Vendor application ' + verbMap[decision] + '.', 'success');
    loadVendorApplications();
  } catch (e) { toast(e.message || 'Failed to review application.', 'error'); }
}

function openBulkVendorModal() {
  document.getElementById('bulkv-input').value = '';
  document.getElementById('bulkv-result').innerHTML = '';
  document.getElementById('bulkv-error').textContent = '';
  openModal('modal-bulk-vendor');
}

function _parseBulkVendorLine(line) {
  const delim = line.includes('\t') ? '\t' : ',';
  const cols = line.split(delim).map(c => c.trim());
  return {
    companyName: cols[0] || '', tradeName: cols[1] || '', businessCategory: cols[2] || '',
    tinNumber: cols[3] || '', dtisecReg: cols[4] || '', contactPerson: cols[5] || '',
    contactNumber: cols[6] || '', email: cols[7] || '', address: cols[8] || '',
  };
}

async function submitBulkVendors() {
  const errEl = document.getElementById('bulkv-error');
  const resultEl = document.getElementById('bulkv-result');
  errEl.textContent = '';
  resultEl.innerHTML = '';
  const lines = document.getElementById('bulkv-input').value.split('\n').map(l => l.trim()).filter(Boolean);
  if (!lines.length) { errEl.textContent = 'Paste at least one vendor row.'; return; }
  // Skip an obvious header row (first line mentions "email" or "company")
  if (/email|company/i.test(lines[0])) lines.shift();
  if (!lines.length) { errEl.textContent = 'No data rows found after the header.'; return; }

  const rows = lines.map(_parseBulkVendorLine);
  try {
    const res = await gsRun('bulkAddAccreditedVendors', SESSION.token, rows);
    const r = res.results;
    let html = `<p class="hint">${r.created} added, ${r.updated} updated${r.failed.length ? ', ' + r.failed.length + ' failed' : ''}.</p>`;
    if (r.failed.length) {
      html += `<ul class="file-list">` + r.failed.map(f => `<li><span class="error-text">Row ${f.row}${f.email ? ' (' + escapeHtml(f.email) + ')' : ''}: ${escapeHtml(f.message)}</span></li>`).join('') + `</ul>`;
    }
    resultEl.innerHTML = html;
    if (r.created || r.updated) { toast('Bulk import complete.', 'success'); loadVendorApplications(); }
  } catch (e) { errEl.textContent = e.message || 'Bulk import failed.'; }
}

// ── STAFF: KPI DASHBOARD ─────────────────────────────────────────
async function loadDashboard() {
  const el = document.getElementById('staff-dashboard-content');
  el.innerHTML = '<p class="hint">Loading…</p>';
  try {
    const res = await gsRun('getDashboardStats', SESSION.token);
    renderDashboard(res.stats);
  } catch (e) { el.innerHTML = '<p class="error-text">Failed to load dashboard. ' + escapeHtml(e.message || String(e)) + '</p>'; }
}

function renderDashboard(s) {
  const el = document.getElementById('staff-dashboard-content');
  const tiles = [
    ['Total Bid Opportunities', s.totalBids],
    ['Published', s.publishedCount],
    ['Accredited Vendors', s.approvedVendors],
    ['Pending Vendor Applications', s.pendingVendors],
    ['Total Inquiries', s.totalInquiries],
    ['Open Inquiries', s.openInquiries],
  ];
  el.innerHTML = `
    <div class="stat-grid">${tiles.map(([label, num]) => `<div class="stat-tile"><div class="num">${num}</div><div class="label">${label}</div></div>`).join('')}</div>
    <div style="display:grid;grid-template-columns:1fr 1fr 1fr;gap:16px;margin-top:20px;flex-wrap:wrap;">
      <div class="card" style="min-width:200px;">
        <h4 style="margin-bottom:14px;font-size:13px;text-transform:uppercase;letter-spacing:.05em;">Bids by Status</h4>
        <canvas id="chart-bid-status"></canvas>
      </div>
      <div class="card" style="min-width:200px;">
        <h4 style="margin-bottom:14px;font-size:13px;text-transform:uppercase;letter-spacing:.05em;">Vendor Accreditation</h4>
        <canvas id="chart-vendor-status"></canvas>
      </div>
      <div class="card" style="min-width:200px;">
        <h4 style="margin-bottom:14px;font-size:13px;text-transform:uppercase;letter-spacing:.05em;">Inquiries</h4>
        <canvas id="chart-inquiries"></canvas>
      </div>
    </div>`;

  const chartDefaults = { plugins: { legend: { position: 'bottom', labels: { boxWidth: 12, font: { size: 12 } } } }, cutout: '62%', responsive: true };

  // Bid status pie
  const statusColors = { Draft: '#9ca3af', PendingApproval: '#3b82f6', Approved: '#3C8F55', Published: '#17452A', Closed: '#6b7280' };
  const statusLabels = Object.keys(s.byStatus);
  new Chart(document.getElementById('chart-bid-status'), {
    type: 'doughnut',
    data: { labels: statusLabels, datasets: [{ data: statusLabels.map(k => s.byStatus[k]), backgroundColor: statusLabels.map(k => statusColors[k] || '#2A7443'), borderWidth: 2, borderColor: '#fff' }] },
    options: chartDefaults,
  });

  // Vendor accreditation pie
  const otherVendors = Math.max(0, (s.totalVendors || 0) - s.approvedVendors - s.pendingVendors);
  new Chart(document.getElementById('chart-vendor-status'), {
    type: 'doughnut',
    data: { labels: ['Approved', 'Pending', 'Others'], datasets: [{ data: [s.approvedVendors, s.pendingVendors, otherVendors], backgroundColor: ['#1F5C34', '#3C8F55', '#9ca3af'], borderWidth: 2, borderColor: '#fff' }] },
    options: chartDefaults,
  });

  // Inquiries pie
  const answered = (s.totalInquiries || 0) - (s.openInquiries || 0);
  new Chart(document.getElementById('chart-inquiries'), {
    type: 'doughnut',
    data: { labels: ['Answered', 'Open'], datasets: [{ data: [answered, s.openInquiries], backgroundColor: ['#17452A', '#3C8F55'], borderWidth: 2, borderColor: '#fff' }] },
    options: chartDefaults,
  });
}

// ── STAFF: USERS MANAGEMENT (cpd_admin only) ─────────────────────
let STAFF_USERS_CACHE = [];

async function loadUsers() {
  const el = document.getElementById('staff-users-table');
  el.innerHTML = '<p class="hint">Loading…</p>';
  try {
    const res = await gsRun('getUsers', SESSION.token);
    STAFF_USERS_CACHE = res.users;
    el.innerHTML = `<table><thead><tr><th>Email</th><th>Name</th><th>Role</th><th>Department</th><th>Status</th><th>Actions</th></tr></thead><tbody>` +
      res.users.map(u => `<tr>
        <td>${escapeHtml(u.Email)}</td><td>${escapeHtml(u.FullName)}</td><td>${escapeHtml(roleLabel(u.Role))}</td>
        <td>${escapeHtml(u.Department)}</td><td><span class="stamp ${u.Status === 'Active' ? 'stamp-green' : 'stamp-red'}">${escapeHtml(u.Status)}</span></td>
        <td>
          <button class="btn btn-sm btn-outline" onclick="openUserEditor('${u.UserID}')">Edit</button>
          ${u.Status === 'Active' ? `<button class="btn btn-sm btn-danger" onclick="deactivateUserAction('${u.UserID}')">Deactivate</button>` : ''}
          <button class="btn btn-sm btn-danger" style="padding:4px 8px;" title="Delete user" data-uid="${escapeHtml(u.UserID)}" data-name="${escapeHtml(u.FullName)}" onclick="deleteUserAction(this.dataset.uid, this.dataset.name)">🗑</button>
        </td>
      </tr>`).join('') + `</tbody></table>`;
  } catch (e) { el.innerHTML = '<p class="error-text">Failed to load staff users. ' + escapeHtml(e.message || String(e)) + '</p>'; }
}

function openUserEditor(userId) {
  const existing = userId ? STAFF_USERS_CACHE.find(u => u.UserID === userId) : null;
  document.getElementById('edituser-title').textContent = existing ? 'Edit Staff User' : 'Add Staff User';
  const emailInput = document.getElementById('edituser-email');
  emailInput.value = existing ? existing.Email : '';
  emailInput.disabled = !!existing;
  document.getElementById('edituser-email-hint').style.display = existing ? '' : 'none';
  document.getElementById('edituser-fullName').value = existing ? existing.FullName : '';
  document.getElementById('edituser-role').value = existing ? existing.Role : 'cpd_officer';
  document.getElementById('edituser-department').value = existing ? existing.Department : '';
  document.getElementById('edituser-status-field').style.display = existing ? '' : 'none';
  document.getElementById('edituser-status').value = existing ? existing.Status : 'Active';
  document.getElementById('edituser-error').textContent = '';
  openModal('modal-edit-user');
}

async function submitEditUser() {
  const errEl = document.getElementById('edituser-error');
  errEl.textContent = '';
  const d = {
    email: document.getElementById('edituser-email').value.trim(),
    fullName: document.getElementById('edituser-fullName').value.trim(),
    role: document.getElementById('edituser-role').value,
    department: document.getElementById('edituser-department').value.trim(),
    status: document.getElementById('edituser-status').value,
  };
  if (!d.email || !d.fullName) { errEl.textContent = 'Email and full name are required.'; return; }
  try {
    await gsRun('saveUser', SESSION.token, d);
    toast('Staff user saved.', 'success');
    closeModal('modal-edit-user');
    loadUsers();
  } catch (e) { errEl.textContent = e.message || 'Failed to save staff user.'; }
}

async function deactivateUserAction(userId) {
  if (!await showConfirm('Deactivate this staff user?')) return;
  try { await gsRun('deactivateUser', SESSION.token, userId); toast('Staff user deactivated.', 'success'); loadUsers(); }
  catch (e) { toast(e.message || 'Failed to deactivate.', 'error'); }
}

async function deleteUserAction(userId, name) {
  if (!await showConfirm('Permanently delete ' + (name || 'this user') + '? This cannot be undone.')) return;
  try { await gsRun('deleteUser', SESSION.token, userId); toast('Staff user deleted.', 'success'); loadUsers(); }
  catch (e) { toast(e.message || 'Failed to delete.', 'error'); }
}
